version: "3"

vars:
  APP_NAME: "paradox-modding-tools"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: "{{.GOOS | default OS}}"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          VERSION: "{{.VERSION}}"
          DEV: "{{.DEV}}"
          EXTRA_TAGS: "{{.EXTRA_TAGS}}"
          OBFUSCATED: "{{.OBFUSCATED}}"
          GARBLE_ARGS: "{{.GARBLE_ARGS}}"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          VERSION: "{{.VERSION}}"
          FORMAT: "{{.FORMAT}}"
          INSTALL_SCOPE: "{{.INSTALL_SCOPE}}"
          CERT_PATH: "{{.CERT_PATH}}"
          PUBLISHER: "{{.PUBLISHER}}"
          USE_MSIX_TOOL: "{{.USE_MSIX_TOOL}}"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"
        vars:
          VERSION: "{{.VERSION}}"

  dev:
    summary: Runs the application in development mode
    deps:
      - task: common:build:steamugc
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  test:
    summary: Fast backend tests (~2s). Skips the real-install tier.
    dir: services
    cmds:
      - go test -short ./...

  test:full:
    summary: >
      Backend tests including the real-install tier (~2m). Needs
      PMT_TEST_INSTALL_{CK3,VIC3,EU5} and PMT_TEST_DOCS_{CK3,VIC3,EU5};
      the heavy tests skip themselves when those are unset.
    dir: services
    cmds:
      - go test ./... -timeout 1800s

  test:sweep:
    summary: >
      Engine scoreboard: every Workspace Health check against every workshop mod
      (~9min). Not part of test or test:full. Needs PMT_TEST_INSTALL_{CK3,VIC3,EU5}.
      Counts are for investigation, not targets — see the baseline file. Runs the
      determinism guard alongside, because a count that moves between runs cannot
      be read as a regression either way.
    dir: services
    cmds:
      - go test ./internal/views/ -run 'TestSweep|TestHealthIsDeterministic' -v -timeout 3600s
