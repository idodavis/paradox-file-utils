{{/* Left nav: Home, then children of / by weight, with section fold. */}}
<aside class="side" id="sidebar">
  <a class="brand" href="{{ .Site.Home.RelPermalink }}">
    <img src="{{ "assets/PMT-SquareIcon-Mint.png" | relURL }}" width="36" height="36" alt="">
    <span>PMT</span>
  </a>
  <label class="search-wrap">
    <span class="visually-hidden">Search</span>
    <input type="search" id="q" placeholder="Search" autocomplete="off"
      data-index="{{ "index.json" | relURL }}">
    <ul class="hits" id="hits" hidden></ul>
  </label>
  <nav class="nav">
    <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} class="active"{{ end }}>Home</a>
    {{ range .Site.Home.Pages.ByWeight }}
      {{ if .IsSection }}
        {{ $open := or (eq $ .) ($.IsDescendant .) }}
        <details{{ if $open }} open{{ end }}>
          <summary{{ if eq $ . }} class="active"{{ end }}>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          </summary>
          {{ range .Pages.ByWeight }}
            <a href="{{ .RelPermalink }}"{{ if eq $ . }} class="active"{{ end }}>{{ .Title }}</a>
          {{ end }}
        </details>
      {{ else }}
        <a href="{{ .RelPermalink }}"{{ if eq $ . }} class="active"{{ end }}>{{ .Title }}</a>
      {{ end }}
    {{ end }}
  </nav>
</aside>
