name: Build and Release (Cross-Platform)

on:
  push:
    tags: ["v*"]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Wails Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt install build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build Windows amd64
        run: |
          wails3 task windows:build VERSION="$RELEASE_VERSION" GOARCH=amd64
          cp bin/paradox-modding-tools.exe bin/paradox-modding-tools-windows-x64.exe

      - name: Build Windows arm64
        run: |
          wails3 task windows:build VERSION="$RELEASE_VERSION" GOARCH=arm64
          cp bin/paradox-modding-tools.exe bin/paradox-modding-tools-windows-arm64.exe

      - name: Build Linux amd64
        run: |
          wails3 task linux:build VERSION="$RELEASE_VERSION" GOARCH=amd64
          cp bin/paradox-modding-tools bin/paradox-modding-tools-linux-amd64

      - name: Build Linux arm64
        run: |
          wails3 task linux:build VERSION="$RELEASE_VERSION" GOARCH=arm64
          cp bin/paradox-modding-tools bin/paradox-modding-tools-linux-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: bin/*
