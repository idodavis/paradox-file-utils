name: Bug report
description: Something in Paradox Modding Tools is broken
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill this in so we can reproduce it.
        User guide: https://idodavis.github.io/paradox-modding-tools/

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app was affected?
      options:
        - Library
        - Wizard
        - IDE
        - Guide
        - Event Graph
        - Health
        - Patch Center
        - Release / Steam Workshop
        - Workspace Settings
        - Display / themes
        - Language / scan / cache
        - Docs site
        - Build / updater
        - Other
    validations:
      required: true

  - type: input
    id: area-other
    attributes:
      label: If you selected Other, specify
      placeholder: e.g. startup crash, file watcher

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Crusader Kings III
        - Victoria 3
        - Europa Universalis V
        - None / not game-specific
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: macOS is not supported. On Linux, name the distro below.
      options:
        - Windows 10
        - Windows 11
        - Linux (name the distro)
    validations:
      required: true

  - type: input
    id: linux-distro
    attributes:
      label: Linux distro (if Linux)
      placeholder: e.g. Ubuntu 24.04, Fedora 41, Arch

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in the app header.
      placeholder: e.g. 0.4.0

  - type: dropdown
    id: build-source
    attributes:
      label: Build source
      options:
        - GitHub Release zip
        - task dev
        - Local task build
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: Describe the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Open a CK3 workspace
        3. …
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Paths (relative is fine), logs, and anything else. Do not paste secrets.
      placeholder: Workspace game, install pin, whether the session was live…
