name: Feature request
description: Suggest a new feature or improvement for Paradox Modding Tools
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. The more specific you are, the easier it is to evaluate and prioritize.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What feature or improvement would you like to see?
      placeholder: e.g. Add support for exporting merge results to a file.
    validations:
      required: true

  - type: textarea
    id: why-useful
    attributes:
      label: Why this would be useful
      description: How would this help you or other modders?
      placeholder: Explain the benefit and impact.
      render: text
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      description: Which part of the app does this relate to?
      options:
        - Compare tool
        - Merge tool
        - Inventory
        - Modding docs
        - Settings
        - Other
    validations:
      required: true

  - type: input
    id: area-other
    attributes:
      label: If you selected Other, please specify
      placeholder: e.g. Startup experience, updater, UI polish

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other ways to handle this?
      placeholder: Describe any alternative approaches or workarounds.
      render: text

  - type: upload
    id: files
    attributes:
      label: Upload files or mockups
      description: If relevant, attach files, mockups, or screenshots to illustrate your request.
